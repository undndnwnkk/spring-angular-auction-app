server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/auction-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8180/realms/auction-realm

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-route
              uri: http://catalog-service:8081
              predicates:
                - Path=/api/v1/catalog/**
              filters:
                - RewritePath=/api/v1/catalog/(?<segment>.*), /api/v1/$\{segment}
                - UserId

            - id: bidding-route
              uri: http://bidding-service:8082
              predicates:
                - Path=/api/v1/bidding/**
              filters:
                - UserId

            - id: notification-ws-route
              uri: http://notification-service:8083
              predicates:
                - Path=/ws/**
              filters:
                - UserId
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.reactive: DEBUG