server:
  port: 8082

spring:
  application:
    name: bidding-service

  datasource:
    url: ${DB_URL}
    username: ${BIDDING_DB_USERNAME}
    password: ${BIDDING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml