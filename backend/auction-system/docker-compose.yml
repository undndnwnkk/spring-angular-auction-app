services:
  catalog-db:
    image: postgres:16.11-alpine3.23
    container_name: catalog-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USERNAME}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  bidding-db:
    image: postgres:16.11-alpine3.23
    container_name: bidding-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${BIDDING_DB_NAME}
      POSTGRES_USER: ${BIDDING_DB_USERNAME}
      POSTGRES_PASSWORD: ${BIDDING_DB_PASSWORD}
    volumes:
      - bidding-db-data:/var/lib/postgresql/data

  notification-db:
    image: mongo:7.0
    container_name: notification-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICATION_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - ./mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.0
    container_name: auction-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L6699E2SG-9AnHqnNo_7Q"

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME}
      DB_USERNAME: ${CATALOG_DB_USERNAME}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    depends_on:
      - catalog-db
    env_file:
      - .env

  bidding-service:
    build:
      context: .
      dockerfile: bidding-service/Dockerfile
    container_name: bidding-service
    environment:
      DB_URL: jdbc:postgresql://bidding-db:5432/${BIDDING_DB_NAME}
      DB_USERNAME: ${BIDDING_DB_USERNAME}
      DB_PASSWORD: ${BIDDING_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8082:8082"
    depends_on:
      - bidding-db
      - redis
      - kafka
    env_file:
      - .env

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb://${NOTIFICATION_DB_USERNAME}:${NOTIFICATION_DB_PASSWORD}@notification-db:27017/notifications?authSource=admin
    depends_on:
      - kafka
      - notification-db

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - catalog-service
      - bidding-service
      - notification-service


volumes:
  catalog-db-data:
  bidding-db-data: