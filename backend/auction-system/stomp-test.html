<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Auction STOMP Client</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f4; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; border-radius: 4px; border: none; cursor: pointer; background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        #disconnectBtn { background: #dc3545; }
        #log { background: #222; color: #00ff00; padding: 10px; border-radius: 5px; height: 400px; overflow-y: scroll; font-family: monospace; white-space: pre-wrap; }
        .label { font-weight: bold; display: inline-block; width: 120px; }
    </style>
</head>
<body>

<h2>🚀 Auction Real-time Control Panel</h2>

<div class="card">
    <h3>1. Connection Settings</h3>
    <p>
        <span class="label">WebSocket URL:</span>
        <input id="wsUrl" size="40" value="ws://localhost:8083/ws" />
    </p>
    <p>
        <span class="label">My User ID:</span>
        <input id="myUserId" size="40" placeholder="Enter your UUID" value="11111111-1111-1111-1111-111111111111" />
        <small>(This ID will be used for private notifications)</small>
    </p>
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn">Disconnect</button>
</div>

<div class="card">
    <h3>2. Subscriptions</h3>
    <p>
        <span class="label">Lot ID:</span>
        <input id="lotId" size="40" value="" placeholder="Paste Lot UUID here" />
        <button id="subscribeLotBtn" style="background: #28a745;">Subscribe to Lot Updates</button>
    </p>
    <p>
        <span class="label">Private:</span>
        <button id="subscribePrivateBtn" style="background: #6f42c1;">Subscribe to My Notifications</button>
    </p>
</div>

<div class="card">
    <h3>📝 Event Log</h3>
    <div id="log"></div>
</div>

<script src="https://unpkg.com/@stomp/stompjs@6.1.2/bundles/stomp.umd.min.js"></script>

<script>
    const logEl = document.getElementById('log');
    let client = null;

    function log(msg, type = 'INFO') {
        const time = new Date().toISOString().substr(11, 8);
        const color = type === 'DEBUG' ? '#888' : (type === 'ERROR' ? '#ff4444' : '#00ff00');
        const line = `[${time}] [${type}] ${msg}\n`;
        logEl.innerHTML += `<span style="color: ${color}">${line}</span>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('connectBtn').onclick = () => {
        const userId = document.getElementById('myUserId').value;

        client = new StompJs.Client({
            brokerURL: document.getElementById('wsUrl').value,
            connectHeaders: {
                userId: userId // Наш интерцептор поймает этот заголовок
            },
            reconnectDelay: 5000,
            debug: (str) => console.log(str),
        });

        client.onConnect = (frame) => {
            log('CONNECTED as ' + userId);
            log('Session info: ' + JSON.stringify(frame.headers), 'DEBUG');
        };

        client.onStompError = (frame) => {
            log('STOMP ERROR: ' + frame.headers['message'], 'ERROR');
        };

        client.onWebSocketError = (event) => {
            log('WEBSOCKET ERROR', 'ERROR');
        };

        client.activate();
        log('Attempting to connect...');
    };

    document.getElementById('disconnectBtn').onclick = () => {
        if (client) {
            client.deactivate();
            log('Disconnected');
        }
    };

    // Подписка на конкретный лот (Price Updates)
    document.getElementById('subscribeLotBtn').onclick = () => {
        const id = document.getElementById('lotId').value;
        if (!client || !client.active) return log('Error: Connect first!', 'ERROR');
        if (!id) return log('Error: Enter Lot ID!', 'ERROR');

        const dest = '/topic/lot/' + id;
        client.subscribe(dest, (message) => {
            log('🔥 PRICE UPDATE for lot ' + id + ': ' + message.body);
        });
        log('Subscribed to PUBLIC topic: ' + dest);
    };

    // Подписка на личные уведомления (Outbid, etc)
    document.getElementById('subscribePrivateBtn').onclick = () => {
        if (!client || !client.active) return log('Error: Connect first!', 'ERROR');

        // В Spring STOMP персональные очереди начинаются с /user
        const userId = document.getElementById('myUserId').value;
        const dest = '/topic/user/' + userId;
        client.subscribe(dest, (message) => {
            log('🔔 PRIVATE NOTIFICATION: ' + message.body);
        });
        log('Subscribed to PRIVATE topic: ' + dest);
    };
</script>
</body>
</html>
